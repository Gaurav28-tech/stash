<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <radialGradient id="glow" cx="85%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21262d" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="1200" height="380" fill="url(#bg)"/>
  <rect width="1200" height="380" fill="url(#grid)"/>
  <rect width="1200" height="380" fill="url(#glow)"/>

  <!-- Top Category Tag -->
  <g transform="translate(60, 60)">
    <rect width="238" height="26" rx="6" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1"/>
    <text x="14" y="17.5" fill="#f59e0b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">CONCURRENT IN-MEMORY CACHE</text>
  </g>

  <!-- Big Title -->
  <text x="60" y="155" fill="#f0f6fc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="64" font-weight="900" letter-spacing="-1">STASH</text>

  <!-- Tagline -->
  <text x="60" y="210" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="20" font-weight="400">Multi-strategy in-memory cache featuring strict O(1) LRU, LFU, and millisecond TTL expiration.</text>

  <!-- Feature Pills -->
  
        <g transform="translate(60, 285)">
            <rect width="154" height="32" rx="16" fill="#161b22" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1.2"/>
            <circle cx="16" cy="16" r="4" fill="#f59e0b"/>
            <text x="28" y="20.5" fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="500">O(1) LRU Cache</text>
        </g>
        
        <g transform="translate(228, 285)">
            <rect width="154" height="32" rx="16" fill="#161b22" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1.2"/>
            <circle cx="16" cy="16" r="4" fill="#f59e0b"/>
            <text x="28" y="20.5" fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="500">O(1) LFU Cache</text>
        </g>
        
        <g transform="translate(396, 285)">
            <rect width="163" height="32" rx="16" fill="#161b22" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1.2"/>
            <circle cx="16" cy="16" r="4" fill="#f59e0b"/>
            <text x="28" y="20.5" fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="500">Millisecond TTL</text>
        </g>
        
        <g transform="translate(573, 285)">
            <rect width="190" height="32" rx="16" fill="#161b22" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1.2"/>
            <circle cx="16" cy="16" r="4" fill="#f59e0b"/>
            <text x="28" y="20.5" fill="#c9d1d9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="500">Hit/Miss Telemetry</text>
        </g>
        
